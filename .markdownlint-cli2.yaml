# Markdown style, checked in CI. Rules: https://github.com/DavidAnson/markdownlint
config:
  default: true
  MD013:
    line_length: 100
    code_blocks: false
    tables: false
  MD024:
    siblings_only: true

ignores:
  - CHANGELOG.md # generated by release-please
  - .github/pull_request_template.md # starts at level 2, below the pull request title
