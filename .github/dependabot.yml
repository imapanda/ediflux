# Dependency updates. Add an entry per ecosystem (docker, the application's
# package manager...) when it appears in the repository.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing a new release, so that a compromised
    # version is usually caught and yanked before it reaches this repository.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
