# Pull requests are squash-merged and their title becomes the commit message
# on main. Release automation reads those messages, so titles must follow
# Conventional Commits: "feat: ...", "fix(parser): ...", "feat!: ..." for a
# breaking change. See CONTRIBUTING.md.
name: PR title

on:
  pull_request:
    branches: [main]
    # "synchronize" re-runs the check on each push, because a required check
    # must be reported for the latest commit of the pull request.
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # read the pull request title
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >-
            The subject "{subject}" must start with a lowercase letter,
            for example "feat: add EDIFACT parser".
