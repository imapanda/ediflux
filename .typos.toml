# Spell checker configuration, checked in CI: https://github.com/crate-ci/typos
[files]
extend-exclude = [
  "CHANGELOG.md", # generated from commit messages
  "LICENSE",
  "*.edi",
  "*.edifact",
  "*.x12",
  "perf/pgmq/results/**", # raw output of the load test: pgbench and pg_stat_statements cut SQL text mid-word
]

[default.extend-words]
# EDI vocabulary
advices = "advices" # "despatch advices" (DESADV)
contrl = "contrl" # CONTRL syntax and service report message
